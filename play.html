<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#284b46"><title>方块学园 · 进入森林营地</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(#163c4655,#18383ad9),url('./tablet/art/camp-scene-v8.webp') center/cover #315749;font:18px/1.8 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#fff1d2}main{width:540px;max-width:100%;text-align:center;padding:35px 30px;background:#234b46e8;border:2px solid #dcc28a;border-radius:28px;box-shadow:0 10px 0 #173731,0 20px 60px #112e3b88}small{font-size:15px;color:#e7d7a9;letter-spacing:2px}h1{font-size:32px;line-height:1.5;margin:15px 0}p{font-size:18px;margin:12px 0;color:#d2dfca}a,button{font:inherit;cursor:pointer}#enter{display:block;text-decoration:none;padding:14px 22px;margin:26px 0 16px;background:linear-gradient(#ffe5a0,#ddb85c);color:#67552a;font-weight:800;font-size:23px;border:3px solid #fff1b8;border-radius:20px;box-shadow:0 5px #91804a}#enter[aria-disabled=true]{pointer-events:none;opacity:.55}button{padding:10px 18px;min-height:48px;color:#f3e7bd;border:1px solid #a8b58b;background:#315b51;border-radius:13px}footer{font-size:15px;color:#afc5b2;margin-top:23px}footer a{color:#ead7a2}#progress{height:10px;border-radius:8px;background:#15362c;margin:26px 0;overflow:hidden}#progress i{display:block;width:25%;height:100%;background:linear-gradient(90deg,#80bd8c,#f9df8a);transition:width .6s}button:focus-visible,a:focus-visible{outline:3px solid #ffe8a2;outline-offset:5px}@media(max-width:540px){main{padding:28px 22px}h1{font-size:28px}p{font-size:17px}#enter{font-size:22px}}</style></head><body><main><small>方块学园 · 森林冒险版</small><h1 id="heading">准备好，和伙伴出发！</h1><p id="status" role="status">可以直接进入，离线资源会继续准备。</p><div id="progress" aria-hidden="true"><i id="bar"></i></div><a id="enter" href="./open.html">▶ 直接进入学园</a><button id="retry" hidden>再试一次</button><footer>使用原浏览器，账号与学习记录会继续保留。<br><a href="./tablet/">先打开已保存的学园</a></footer></main><script>
(()=>{const release='574bd18a6dd6',entry=new URL('./tablet/',location),direct=new URL('./open.html',location),status=document.getElementById('status'),enter=document.getElementById('enter'),retry=document.getElementById('retry'),bar=document.getElementById('bar');let running=false;
direct.searchParams.set('v',release);enter.href=direct.href;
function deadline(p){let timer;return Promise.race([p,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('离线准备较慢')),40000)})]).finally(()=>clearTimeout(timer))}
async function activated(worker){if(worker.state==='activated')return;let change;try{await deadline(new Promise((resolve,reject)=>{change=()=>{if(worker.state==='activated')resolve();else if(worker.state==='redundant')reject(Error('离线准备未完成'))};worker.addEventListener('statechange',change);change()}))}finally{worker.removeEventListener('statechange',change)}}
async function prepare(){if(running)return;running=true;retry.hidden=true;enter.href=direct.href;enter.textContent='▶ 直接进入学园';status.textContent='可以直接进入，图片和语音会继续下载。';bar.style.width='25%';try{if('serviceWorker'in navigator){const script=new URL('./tablet/sw.js',location);script.searchParams.set('release',release);const reg=await deadline(navigator.serviceWorker.register(script.href,{scope:entry.pathname,updateViaCache:'none'}));const worker=reg.installing||reg.waiting||reg.active;if(!worker||new URL(worker.scriptURL).searchParams.get('release')!==release)throw Error('离线准备未完成');bar.style.width='65%';await activated(worker);worker.postMessage({type:'block-cache-optional'});enter.href=entry.href;status.textContent='学园已可离线打开！图片和语音会继续保存。'}else{status.textContent='可以直接进入学园，本机账号与学习记录会继续保留。'}bar.style.width='100%';enter.textContent='▶ 进入森林营地'}catch(e){status.textContent='离线准备暂未完成。仍可点大按钮直接进入，账号和记录继续保留。';enter.href=direct.href;enter.textContent='▶ 直接进入学园';retry.textContent='重试离线准备';retry.hidden=false;bar.style.width='15%'}finally{running=false}}
retry.addEventListener('click',prepare);prepare();
})();
</script></body></html>
