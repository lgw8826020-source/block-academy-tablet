<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#284b46"><title>方块学园 · 进入森林营地</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(#163c4655,#18383ad9),url('./tablet/art/camp-scene-v8.webp') center/cover #315749;font:18px/1.8 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#fff1d2}main{width:540px;max-width:100%;text-align:center;padding:35px 30px;background:#234b46e8;border:2px solid #dcc28a;border-radius:28px;box-shadow:0 10px 0 #173731,0 20px 60px #112e3b88}small{font-size:15px;color:#e7d7a9;letter-spacing:2px}h1{font-size:32px;line-height:1.5;margin:15px 0}p{font-size:18px;margin:12px 0;color:#d2dfca}a,button{font:inherit;cursor:pointer}#enter{display:block;text-decoration:none;padding:14px 22px;margin:26px 0 16px;background:linear-gradient(#ffe5a0,#ddb85c);color:#67552a;font-weight:800;font-size:23px;border:3px solid #fff1b8;border-radius:20px;box-shadow:0 5px #91804a}#enter[aria-disabled=true]{pointer-events:none;opacity:.55}button{padding:10px 18px;min-height:48px;color:#f3e7bd;border:1px solid #a8b58b;background:#315b51;border-radius:13px}footer{font-size:15px;color:#afc5b2;margin-top:23px}footer a{color:#ead7a2}#progress{height:10px;border-radius:8px;background:#15362c;margin:26px 0;overflow:hidden}#progress i{display:block;width:25%;height:100%;background:linear-gradient(90deg,#80bd8c,#f9df8a);transition:width .6s}button:focus-visible,a:focus-visible{outline:3px solid #ffe8a2;outline-offset:5px}@media(max-width:540px){main{padding:28px 22px}h1{font-size:28px}p{font-size:17px}#enter{font-size:22px}}</style></head><body><main><small>方块学园 · 森林冒险版</small><h1 id="heading">准备好，和伙伴出发！</h1><p id="status" role="status">正在准备新版营地，请保持联网。</p><div id="progress" aria-hidden="true"><i id="bar"></i></div><a id="enter" href="./tablet/" aria-disabled="true">正在准备营地…</a><button id="retry" hidden>再试一次</button><footer>使用原浏览器，账号与学习记录会继续保留。<br><a href="./tablet/">先打开已保存的学园</a></footer></main><script>
(()=>{const release='58c05fd75222',entry=new URL('./tablet/',location),status=document.getElementById('status'),enter=document.getElementById('enter'),retry=document.getElementById('retry'),bar=document.getElementById('bar');let running=false;
function deadline(p){let timer;return Promise.race([p,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('连接较慢，新版还没有准备好。可以稍后重试，或先打开已保存的学园。')),45000)})]).finally(()=>clearTimeout(timer))}
async function activated(worker){if(worker.state==='activated')return;let change;try{await deadline(new Promise((resolve,reject)=>{change=()=>{if(worker.state==='activated')resolve();else if(worker.state==='redundant')reject(Error('这次更新没有完成，请再试一次。'))};worker.addEventListener('statechange',change);change()}))}finally{worker.removeEventListener('statechange',change)}}
async function prepare(){if(running)return;running=true;retry.hidden=true;enter.setAttribute('aria-disabled','true');enter.textContent='正在准备营地…';status.textContent='正在准备新版营地，请保持联网。';bar.style.width='25%';try{if('serviceWorker'in navigator){const script=new URL('./tablet/sw.js',location);script.searchParams.set('release',release);const reg=await deadline(navigator.serviceWorker.register(script.href,{scope:entry.pathname,updateViaCache:'none'}));const worker=reg.installing||reg.waiting||reg.active;if(!worker||new URL(worker.scriptURL).searchParams.get('release')!==release)throw Error('新版还在准备，请稍后重试。');status.textContent='营地正在保存，完成后就能进入。';bar.style.width='65%';await activated(worker);worker.postMessage({type:'block-cache-optional'})}bar.style.width='100%';status.textContent='新版营地准备好啦！点下面的大按钮，和伙伴见面。';enter.textContent='▶ 进入森林营地';enter.removeAttribute('aria-disabled')}catch(e){status.textContent=e.message||'这次没有连接上，稍后再试一次。';enter.textContent='等待营地准备';retry.hidden=false;bar.style.width='15%'}finally{running=false}}
retry.addEventListener('click',prepare);prepare();
})();
</script></body></html>
